html, body { margin: 0; padding: 0; background: #fafafa; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid #e0e0e0; margin-bottom: 16px; }

.today-hdr { background: linear-gradient(135deg, #1F3864, #4472C4); color: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; }
.today-hdr .date { font-size: 20px; font-weight: 600; }
.today-hdr .hint { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.kid-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; }

.block .time { font-size: 11px; color: #555; min-width: 95px; font-variant-numeric: tabular-nums; }
.block .lbl { flex: 1; }

.block.past { opacity: 0.55; }
.block input[type=checkbox] { margin: 0; cursor: pointer; }
.cat-school { background: #FFF2CC; }
.cat-academy { background: #E4D9F0; }
.cat-lunch { background: #D5E3B8; }
.cat-recess { background: #E7E6E6; }

.cat-none { background: #f5f5f5; color: #aaa; }

function cat(txt) {
  if (!txt) return 'none';
  const t = txt.toLowerCase();
  if (t.includes('church')) return 'church';
  if (t.includes('academy')) return 'academy';
  if (t.includes('lunch')) return 'lunch';
  if (t.includes('recess')) return 'recess';
  if (t.includes('(draft)')) return 'draft';
  if (t.includes('year-end project')) return 'project';
  if (['wake','breakfast','morning'].some(x=>t.includes(x))) return 'morning';
  if (['bjj','badminton','swim','lesson','drums practice','piano practice','piano (free play)'].some(x=>t.includes(x))) return 'activity';
  return 'school';
}

let state = { checks: {} };

function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {} }

const now = new Date();
const jsDow = now.getDay();
const todayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][jsDow];
const nowMin = now.getHours()*60 + now.getMinutes();
let selectedDay = todayName;

function getWeekStartDate() {
  const d = new Date(now);
  const offset = (jsDow - WEEK_START_JS_DAY + 7) % 7;
  d.setDate(d.getDate() - offset);
  d.setHours(0,0,0,0);
  return d;
}
const WEEK_START_DATE = getWeekStartDate();

function dateForDay(dayName) {
  const idx = WEEK_ORDER.indexOf(dayName);
  const d = new Date(WEEK_START_DATE);
  d.setDate(d.getDate() + idx);
  return d;
}

function renderDaySelector() {
  const sel = document.getElementById('day-selector');
  sel.innerHTML = WEEK_ORDER.map((d,i) => {
    const classes = ['day-btn'];
    if (d === selectedDay) classes.push('active');
    if (d === todayName) classes.push('today');
    return `<button data-day="${d}" class="${classes.join(' ')}">${WEEK_ORDER_SHORT[i]}</button>`;
  }).join('');
}

function renderKidDay(kidCode, dayName, containerId) {
  const container = document.getElementById(containerId);
  const blocks = BLOCKS.filter(b => b.day === dayName && b.kid === kidCode).sort((a,b)=>a.startMin-b.startMin);
  if (blocks.length === 0) { container.innerHTML = '<div class="empty">Nothing scheduled</div>'; return; }
  const isToday = dayName === todayName;
  container.innerHTML = blocks.map(b => {
    const isPast = isToday && b.endMin <= nowMin;
    const isNow = isToday && b.startMin <= nowMin && nowMin < b.endMin;
    const checked = state.checks[b.id] ? 'checked' : '';
    return `<label class="block cat-${cat(b.label)} ${isNow?'now':''} ${isPast?'past':''}"><input type="checkbox" data-id="${b.id}" ${checked}><span class="time">${b.timeStr}</span><span class="lbl">${b.label}</span></label>`;
  }).join('');
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDayChecklist(kidCode, dayName, workMap, containerId, countId) {
  const container = document.getElementById(containerId);
  const items = workMap[dayName] || [];
  const countEl = document.getElementById(countId);
  if (items.length === 0) {
    container.innerHTML = '<div class="empty">No assignments this day</div>';
    if (countEl) countEl.textContent = '';
    return;
  }
  let done = 0;
  const html = items.map(([subj, path, label]) => {
    const k = `assign|${kidCode}|${subj}|${path}`;
    const isChecked = !!state.checks[k];
    if (isChecked) done++;
    return `<li class="${isChecked?'done':''}"><input type="checkbox" data-id="${k}" ${isChecked?'checked':''}><label><span class="subj-badge">${escapeHTML(subj.replace(/ \(.*?\)$/,''))}</span>${escapeHTML(label)}</label></li>`;
  }).join('');
  container.innerHTML = `<ul class="day-checklist">${html}</ul>`;
  if (countEl) countEl.textContent = `(${done}/${items.length})`;
}

function renderItem(kidCode, subj, path, item) {
  if (typeof item === 'string') {
    const k = `assign|${kidCode}|${subj}|${path}`;
    const checked = state.checks[k] ? 'checked' : '';
    const done = state.checks[k] ? 'done' : '';
    return `<li class="${done}"><label><input type="checkbox" data-id="${k}" ${checked}>${escapeHTML(item)}</label></li>`;
  }
  const subHtml = item.sub.map((s,i) => renderItem(kidCode, subj, `${path}.${i}`, s)).join('');
  return `<li><span class="group-title">${escapeHTML(item.title)}</span><ul>${subHtml}</ul></li>`;
}

function assignCardHTML(workArr, kidCode, kidName) {
  let html = `<h3>${escapeHTML(kidName)}</h3>`;
  workArr.forEach(([subj, items]) => {
    if (items === null) {
      html += `<div class="subj">${escapeHTML(subj)}<span class="na">— N/A this week</span></div>`;
      return;
    }
    html += `<div class="subj">${escapeHTML(subj)}</div><ul>`;
    items.forEach((it, idx) => {
      html += renderItem(kidCode, subj, String(idx), it);
    });
    html += '</ul>';
  });
  return html;
}

function renderDayView() {
  const d = dateForDay(selectedDay);
  document.getElementById('today-date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + (selectedDay === todayName ? ' — Today' : '');
  document.getElementById('today-hint').textContent = hints[selectedDay] || '';
  renderKidDay('g', selectedDay, 'today-ginny');
  renderKidDay('c', selectedDay, 'today-casey');
  renderDayChecklist('gA', selectedDay, GINNY_WEEK, 'today-ginny-checklist', 'ginny-count');
  renderDayChecklist('cA', selectedDay, CASEY_WEEK, 'today-casey-checklist', 'casey-count');
  document.querySelectorAll('#day-selector button').forEach(b => b.classList.toggle('active', b.dataset.day === selectedDay));
}

function renderAssignments() {
  document.getElementById('assign-ginny').innerHTML = assignCardHTML(WORK_G, 'gA', 'Ginny');
  document.getElementById('assign-casey').innerHTML = assignCardHTML(WORK_C, 'cA', 'Casey');
  document.getElementById('assign-shared').innerHTML = assignCardHTML(WORK_SHARED, 'sA', 'Both');
}

document.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox][data-id]')) {
    const id = e.target.dataset.id;
    state.checks[id] = e.target.checked;
    saveState();
    document.querySelectorAll(`input[data-id="${CSS.escape(id)}"]`).forEach(cb => {
      cb.checked = e.target.checked;
      const li = cb.closest('li');
      if (li) li.classList.toggle('done', e.target.checked);
    });
    const ginnyItems = GINNY_WEEK[selectedDay] || [];
    const ginnyDone = ginnyItems.filter(([s,p]) => state.checks[`assign|gA|${s}|${p}`]).length;
    const gc = document.getElementById('ginny-count');
    if (gc && ginnyItems.length) gc.textContent = `(${ginnyDone}/${ginnyItems.length})`;
    const caseyItems = CASEY_WEEK[selectedDay] || [];
    const caseyDone = caseyItems.filter(([s,p]) => state.checks[`assign|cA|${s}|${p}`]).length;
    const cc = document.getElementById('casey-count');
    if (cc && caseyItems.length) cc.textContent = `(${caseyDone}/${caseyItems.length})`;
  }
});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
}));

document.getElementById('day-selector').addEventListener('click', e => {
  if (e.target.matches('button[data-day]')) {
    selectedDay = e.target.dataset.day;
    renderDayView();
  }
});

document.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', e => {
  e.preventDefault();
  const kidCode = btn.dataset.reset === 'ginny' ? 'g' : 'c';
  const kidAssignCode = kidCode === 'g' ? 'gA' : 'cA';
  const workMap = kidCode === 'g' ? GINNY_WEEK : CASEY_WEEK;
  BLOCKS.filter(b => b.kid === kidCode && b.day === selectedDay).forEach(b => { delete state.checks[b.id]; });
  (workMap[selectedDay] || []).forEach(([s, p]) => { delete state.checks[`assign|${kidAssignCode}|${s}|${p}`]; });
  saveState();
  renderDayView();
  renderAssignments();
}));

renderDaySelector();
renderDayView();
renderAssignments();
</script>
</body>
</html>
